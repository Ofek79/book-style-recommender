# Runs the database only. The server and frontend run outside Docker.
# Start: docker compose up -d

services:
  db:
    image: postgres:16
    # Values come from the .env file next to this file.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Expose the database on localhost:5432 so the server running outside Docker can connect.
      - "5432:5432"
    volumes:
      # Persist database data between runs. Without this, every docker compose down wipes everything.
      - db_data:/var/lib/postgresql/data
      # Postgres runs every .sql file in this directory, in filename order,
      # but only on first startup (empty data volume). schema.sql then
      # seed.sql sorts correctly by name. To re-run after editing them,
      # `docker compose down -v` first to wipe db_data, then `up -d` again.
      - ./db:/docker-entrypoint-initdb.d

volumes:
  db_data:
