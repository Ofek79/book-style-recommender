<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book-A-Like</title>
    <!-- Fonts: David Libre (headings) and Assistant (body), both with
         Hebrew and Latin. Loaded from Google Fonts - see DECISIONS.md.
         preconnect opens the connection early so text appears sooner;
         display=swap shows the fallback font until these load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=David+Libre:wght@700&display=swap"
    />
  </head>
  <body>
    <!-- React mounts the whole app into this element. -->
    <div id="root"></div>
    <!-- Entry module. Vite serves and bundles starting from here. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
